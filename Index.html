<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Tap GPS Sender</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--accent);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .device-info {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 20px;
            word-break: break-all;
        }

        .data-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }

        .data-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .data-value {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            margin-bottom: 20px;
        }

        .status-badge.active {
            background-color: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GPS Sender</h1>
        <p class="subtitle">Single-Tap Cloud Sync</p>

        <div id="deviceTag" class="device-info">Device ID: Loading...</div>
        <div id="statusBadge" class="status-badge">Status: Ready</div>

        <div class="data-card">
            <div class="data-label">Latitude</div>
            <div id="latVal" class="data-value">0.000000</div>
        </div>

        <div class="data-card">
            <div class="data-label">Longitude</div>
            <div id="lonVal" class="data-value">0.000000</div>
        </div>

        <div class="data-card">
            <div class="data-label">Last Sent</div>
            <div id="timeVal" class="data-value">--:--:--</div>
        </div>

        <button id="sendBtn">Send My Location</button>
    </div>

    <!-- Firebase SDK & Single-Tap Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBeJ-ltQnHF-6uUaFbA5VzeiSsTMkTvMt4",
            databaseURL: "https://database-1-1b5f8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "database-1-1b5f8",
            appId: "1:664707238336:web:a199d6c63ba172793f2025"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const sendBtn = document.getElementById('sendBtn');
        const statusBadge = document.getElementById('statusBadge');
        const latVal = document.getElementById('latVal');
        const lonVal = document.getElementById('lonVal');
        const timeVal = document.getElementById('timeVal');
        const deviceTag = document.getElementById('deviceTag');

        // --- UNIQUE DEVICE ID ---
        let deviceId = localStorage.getItem('gps_tracker_device_id');
        if (!deviceId) {
            deviceId = 'phone_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36).slice(-4);
            localStorage.setItem('gps_tracker_device_id', deviceId);
        }
        deviceTag.textContent = "Device ID: " + deviceId;

        // --- SINGLE-TAP LOCATION PUSH ---
        sendBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by this device.");
                return;
            }

            statusBadge.textContent = "Status: Acquiring GPS...";
            statusBadge.classList.remove('active');
            sendBtn.disabled = true;
            sendBtn.textContent = "Sending...";

            // Fetch a single GPS fix using getCurrentPosition
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const timeString = new Date().toLocaleTimeString();

                    // Update UI
                    latVal.textContent = lat.toFixed(6);
                    lonVal.textContent = lon.toFixed(6);
                    timeVal.textContent = timeString;

                    let deviceId = localStorage.getItem("commuter_device_id");
if (!deviceId) {
    deviceId = "commuter_" + Math.random().toString(36).substring(2, 9);
    localStorage.setItem("commuter_device_id", deviceId);
}
                    // Push to Firebase under this device's node
                    const deviceRef = ref(db, 'devices/' + deviceId);
                    set(deviceRef, {
                        deviceId: deviceId,
                        latitude: lat,
                        longitude: lon,
                        timestamp: Date.now()
                    })
                    .then(() => {
                        statusBadge.textContent = "Status: Successfully Sent!";
                        statusBadge.classList.add('active');
                        sendBtn.disabled = false;
                        sendBtn.textContent = "Send My Location";
                    })
                    .catch((error) => {
                        console.error("Firebase error:", error);
                        statusBadge.textContent = "Status: Firebase Error";
                        sendBtn.disabled = false;
                        sendBtn.textContent = "Send My Location";
                    });

                },
                (error) => {
                    console.error(error);
                    statusBadge.textContent = "Status: GPS Permission Denied / Error";
                    statusBadge.classList.remove('active');
                    sendBtn.disabled = false;
                    sendBtn.textContent = "Send My Location";
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    </script>
</body>
</html>
